name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Formatting
        run: test -z "$(gofmt -l server gui/panel)"
      - name: Vet (Linux)
        run: cd server && go vet ./...
      - name: Vet (Windows)
        run: cd server && GOOS=windows GOARCH=amd64 go vet ./...
      - name: Vet panel (Linux)
        run: cd gui/panel && go vet ./...
      - name: Vet panel (Windows)
        run: cd gui/panel && GOOS=windows GOARCH=amd64 go vet ./...

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build (Linux amd64)
        run: |
          cd server
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../DOpad-linux-amd64 .

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build (Windows amd64)
        shell: bash
        run: |
          cd server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -tags vigemdll -o ../DOpad-windows-amd64.exe .

  package:
    runs-on: ubuntu-latest
    needs: [check, build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # لقراءة رقم الإصدار من آخر وسم Git
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build ready-to-run packages
        run: make dist
      - name: Show package contents
        run: find dist -maxdepth 2 -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: DOpad-packages
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DOpad-packages
          path: dist
      - name: Create archives
        run: |
          cd dist
          for d in DOpad-*; do
            [ -d "$d" ] || continue
            case "$d" in
              *-linux*)   tar -czf "$d.tar.gz" "$d" ;;
              *-windows*) zip -qr  "$d.zip"    "$d" ;;
            esac
          done
          ls -1 *.tar.gz *.zip | sort
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {inside=1; next}
            inside && /^## \[/ {exit}
            inside {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
